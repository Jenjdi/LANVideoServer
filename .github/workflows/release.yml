name: Build and publish release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v1.0.0
      verify_only:
        description: Verify the published assets without rebuilding
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install build and test tools
        if: ${{ !inputs.verify_only }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gh build-essential cmake \
            libssl-dev libsqlite3-dev libcpp-httplib-dev nlohmann-json3-dev libsodium-dev \
            libtorrent-rasterbar-dev libboost-system-dev python3-venv ffmpeg chromium nginx openssl
      - name: Install verification runtime
        if: ${{ inputs.verify_only }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gh python3 \
            libssl3t64 libsqlite3-0 libcpp-httplib0.18 libsodium23 libtorrent-rasterbar2.0t64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Build and test
        if: ${{ !inputs.verify_only }}
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r tests/requirements.txt
          PYTHON="$PWD/.venv/bin/python" bash scripts/build.sh
      - name: Package and verify
        if: ${{ !inputs.verify_only }}
        run: |
          .venv/bin/python scripts/package.py --output dist > build-release/package.json
          .venv/bin/python scripts/copyright-package.py --output dist > build-release/copyright.json
          .venv/bin/python - <<'PY'
          import hashlib, json, pathlib, subprocess
          record=json.loads(pathlib.Path('build-release/package.json').read_text())
          subprocess.run(['.venv/bin/python','tests/package_smoke.py',record['archive']],check=True)
          output=pathlib.Path('dist')
          (output/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(output.iterdir()) if p.is_file()))
          PY
      - name: Publish GitHub release
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "轻量级视频共享与传输软件 V1.0" --notes-file docs/release-notes.md
          fi
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease,assets > build-release/release-status.json
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json url,tagName,isDraft,assets > release-status.json
          gh release download "$TAG" --dir build-verified-assets
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          data=json.loads(pathlib.Path('release-status.json').read_text())
          assert data['tagName']==os.environ['TAG'] and not data['isDraft']
          folder=pathlib.Path('build-verified-assets')
          for line in (folder/'SHA256SUMS').read_text().splitlines():
              digest,name=line.split('  ',1)
              assert pathlib.Path(name).name==name
              assert hashlib.sha256((folder/name).read_bytes()).hexdigest()==digest
          assert len(list(folder.glob('*copyright*.zip')))==1
          archive=next(folder.glob('*.tar.gz'))
          subprocess.run(['python3','tests/package_smoke.py',str(archive)],check=True)
          print('Published release and downloaded assets verified:',data['url'])
          PY
